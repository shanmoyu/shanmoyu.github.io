logo:
  title: ShanMoYu
  avatar: /images/头像.webp
  # avatar: '[https://i0.hdslb.com/bfs/openplatform/bf37c429c850f1d264d316c325b7ad78ff0208b5.jpg](/about/)'
  subtitle: '不知道写什么就先占着 | Designed by SMY'



# 语言
language:
  - zh-CN
  - en
  - zh-TW


# 侧边栏主功能导航菜单
menubar:
  columns: 3 # 一行多少个
  items: # 可按照自己需求增加，符合以下格式即可
    - id: post # 页面中高亮的 menu_id
      theme: '#1BCDFC' # 高亮时的颜色，仅 svg 中 fill="currentColor" 时有效
      # icon: solar:documents-bold-duotone # 支持 svg/img 标签，可以定义在 icons.yml 文件中，也支持外部图片的 URL
      title: 博客 # 标题
      url: / # 跳转链接，支持相对路径和绝对路径
    - id: wiki
      theme: '#3DC550'
      # icon: solar:notebook-bookmark-bold-duotone
      title: 文档
      url: /wiki/
    # - id: explore
    #   theme: '#FA6400'
    #   icon: solar:planet-bold-duotone
    #   title: 探索
    #   url: /explore/
    - id: social
      theme: '#F44336'
      # icon: solar:chat-square-like-bold-duotone
      title: 社交
      url: /friends/


#全局样式
style:
  #字体
  font-family:
    logo: 'LXGW WenKai Screen'
    body: 'LXGW WenKai Screen'

  #侧边栏样式
  leftbar:
    # 可以设置：纯色/渐变色/图片作为背景
    # background: var(--leftbar-bg)
    # background-image: url(/images/007.jpg)
    background-image: none
  # site:
  #   background-image: 'url(/images/007.jpg)'
  #   blur-px: 0px # 模糊半径
  #   blur-bg: var(--alpha75) # 模糊颜色

 




######## Article ########
article:
  # license: '本文采用 [署名-非商业性使用-相同方式共享 4.0 国际](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。'
  license: false


######## Main ########
# 站点主结构树
site_tree:
  # -- 列表类页面 -- #
  # 主页配置
  home:
    leftbar: recent, recommend
    rightbar: Github




